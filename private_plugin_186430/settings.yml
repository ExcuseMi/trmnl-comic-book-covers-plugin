---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'yes'
static_data: ''
polling_verb: get
framework_version: 2.3.7
serverless_language: node
polling_url: "{% liquid\r\n  assign selected_series = trmnl.plugin_settings.custom_fields_values.selected_series\r\n  assign seed = trmnl.system.timestamp_utc | divided_by: 3600\r\n  assign count = selected_series.size\r\n\r\n  comment\r\n    Strip legacy \"|weight\" suffix from each series entry\r\n  endcomment\r\n  assign clean_series = \"\"\r\n  for entry in selected_series\r\n    assign series_id = entry | split: \"|\" | first\r\n    assign clean_series = clean_series | append: series_id | append: \",\"\r\n  endfor\r\n  assign selected_series = clean_series | split: \",\" | compact\r\n\r\n  if count <= 5\r\n    assign series_ids = selected_series | join: \",\"\r\n  else\r\n    assign picked = \"\"\r\n    for i in (1..5)\r\n      assign offset = seed | times: i | modulo: count\r\n      assign picked_id = selected_series[offset]\r\n      assign picked = picked | append: picked_id | append: \",\"\r\n    endfor\r\n    assign series_ids = picked | split: \",\" | uniq | join: \",\"\r\n  endif\r\n\r\n  assign api_url = \"https://trmnl.bettens.dev/comic-book-covers/comics/random\"\r\n  assign api_url = api_url | append: \"?series_ids=\" | append: series_ids\r\n  assign api_url = api_url | append: \"&count=10\"\r\n  assign api_url = api_url | append: \"&seed=\" | append: seed\r\n%}\r\n{{ api_url }}"
polling_headers: ''
polling_body: ''
id: 186430
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: about
  name: About This Plugin
  field_type: author_bio
  help_text: TRMNL X Ready
  description: 'Display random comic book covers on your TRMNL e-ink device using the  <strong><a href="https://comicvine.gamespot.com/">Comic Vine</a></strong> API.<br /><br /> <strong>How it works:</strong><br /> • Select from 250 most popular comic series<br /> • Plugin displays random covers from your selected series<br /> • Images are proxied for optimal e-ink display<br />

    '
  learn_more_url: https://comicvine.gamespot.com/api/
  github_url: https://github.com/ExcuseMi/trmnl-comic-book-covers-plugin
  category: comics,art
- keyname: selected_series
  name: Comic Series
  field_type: xhrSelect
  endpoint: https://trmnl.bettens.dev/comic-book-covers/series/search
  http_verb: GET
  exclude_csrf_token: true
  multiple: true
  optional: false
  description: 'Select one or more comic series to display covers from. Shows the top 250 most popular series by issue count.

    '
  help_text: 'Use <kbd>⌘</kbd>+<kbd>click</kbd> or <kbd>Ctrl</kbd>+<kbd>click</kbd> to select multiple series. At least one series must be selected.

    '
- keyname: show_background
  name: Show Background
  field_type: boolean
  description: Show a blurred comic cover as the background.
  optional: true
  default: true
name: Comic Book Covers
refresh_interval: 15
