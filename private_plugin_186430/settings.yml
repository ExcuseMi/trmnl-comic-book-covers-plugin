---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'yes'
static_data: ''
polling_verb: get
polling_url: "{% liquid\r\n  \r\n  assign display_style_parts = display_style | split: \"|\"\r\n  assign count = display_style_parts[3] | plus: 0\r\n  \r\n  assign selected_series = trmnl.plugin_settings.custom_fields_values.selected_series\r\n  \r\n\r\n  assign series_ids = selected_series | join: \",\"\r\n  \r\n\r\n  assign seed = trmnl.system.timestamp_utc | divided_by: 3600\r\n  \r\n  assign api_url = \"https://trmnl.bettens.dev/comic-book-covers/comics/random\"\r\n  assign api_url = api_url | append: \"?series_ids=\" | append: series_ids\r\n  assign api_url = api_url | append: \"&count=\" | append: count\r\n  assign api_url = api_url | append: \"&seed=\" | append: seed\r\n%}\r\n\r\n{{ api_url }}"
polling_headers: ''
polling_body: ''
id: 186430
custom_fields:
- keyname: about
  name: About This Plugin
  field_type: author_bio
  description: 'Display random comic book covers on your TRMNL e-ink device using the  <strong><a href="https://comicvine.gamespot.com/">Comic Vine</a></strong> API.<br /><br /> <strong>How it works:</strong><br /> • Select from 250 most popular comic series<br /> • Plugin displays random covers from your selected series<br /> • Images are proxied for optimal e-ink display<br />

    '
  learn_more_url: https://comicvine.gamespot.com/api/
  github_url: https://github.com/ExcuseMi/trmnl-comic-book-covers-plugin
  category: comics,art
- keyname: selected_series
  name: Comic Series
  field_type: xhrSelect
  endpoint: https://trmnl.bettens.dev/comic-book-covers/series/search
  http_verb: GET
  exclude_csrf_token: true
  multiple: true
  optional: false
  description: 'Select one or more comic series to display covers from. Shows the top 250 most popular series by issue count.

    '
  help_text: 'Use <kbd>⌘</kbd>+<kbd>click</kbd> or <kbd>Ctrl</kbd>+<kbd>click</kbd> to select multiple series. At least one series must be selected.

    '
- keyname: display_style
  name: Display Style
  field_type: select
  description: Choose how comic covers are displayed.
  optional: false
  options:
  - Full Screen Covers Landscape: full|cover|landscape|3
  - Full Screen Details Landscape: full|details|landscape|1
  - Full Screen Cover Portrait: full|cover|portrait|1
  - Half horizontal Cover Landscape: horizontal|cover|landscape|4
  - Half horizontal Details Landscape: horizontal|details|landscape|1
  - Half horizontal Cover Portrait: horizontal|cover|portrait|2
  - Half vertical Cover Landscape: vertical|cover|landscape|1
  - Half vertical Cover Portrait: vertical|cover|portrait|1
  - Quadrant Covers Landscape: quadrant|cover|landscape|3
  - Quadrant Details Landscape: quadrant|details|landscape|1
  - Quadrant Covers Portrait: quadrant|cover|portrait|1
- keyname: show_background
  name: Show Background
  field_type: select
  description: Show a blurred comic cover as the background.
  optional: false
  default: 'yes'
  options:
  - 'No': 'no'
  - 'Yes': 'yes'
name: Comic Book Covers
refresh_interval: 15
